packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  # Use the Node wrapper and lockfile-installed native binary without rewriting CLI shims.
  pnpm: false

auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5

overrides:
  '@simple-git/argv-parser': 2.0.1
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  fast-uri: 3.1.9
  'glob@>=10.2.0 <10.5.0': 13.0.6
  '@vercel/nft': 1.11.11
  'js-beautify>glob': ^14.0.6
  'js-beautify>editorconfig': ^4.0.1
  'archiver>readdir-glob': ^4.0.0
  node-forge: 1.4.3
  shell-quote: 1.12.0
  serialize-javascript: 7.1.4
  simple-git: 4.0.2
  source-map-js: 1.2.2
  sharp: 0.35.5
