services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: publisher_test
      POSTGRES_PASSWORD: publisher_test
      POSTGRES_DB: publisher_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U publisher_test -d publisher_test"]
      interval: 2s
      timeout: 2s
      retries: 20
