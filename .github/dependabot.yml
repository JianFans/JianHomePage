version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(依赖)"
      prefix-development: "chore(开发依赖)"
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(Go 依赖)"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(容器依赖)"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(依赖)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
