name: Check Code

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build and validate
        type: string
        required: false
        default: ''
      version:
        description: Release version for archive names; otherwise use the commit SHA
        type: string
        required: false
        default: ''
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: code-check-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify synchronized Node and Go application versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/set-release-version.mjs --check "$RELEASE_VERSION"
      - name: Verify frontend and static output
        run: pnpm verify
      - name: Verify generated TypeScript contract
        run: git diff --exit-code -- packages/schema/src/generated.ts
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high --ignore-unfixable --registry=https://registry.npmjs.org

  go:
    name: Go Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build embedded browser and renderer assets
        run: pnpm build:server:assets
      - name: Verify Go service
        run: pnpm verify:go
      - name: Verify synchronized Go contracts
        run: git diff --exit-code -- apps/server/internal/contract/schema.json apps/server/internal/httpapi/openapi.yaml
      - name: Run Go race tests
        working-directory: apps/server
        run: go test -race ./... -count=1
      - name: Archive validated embedded assets
        run: |
          mkdir -p dist
          tar -czf dist/embedded-assets.tar.gz -C apps/server/internal/webassets/bundle .
      - name: Upload embedded assets for binary builds
        uses: actions/upload-artifact@v7
        with:
          name: embedded-assets
          path: dist/embedded-assets.tar.gz
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript coverage
        run: pnpm test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore

  go-coverage:
    name: Go Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build embedded browser and renderer assets
        run: pnpm build:server:assets
      - name: Verify Go coverage
        run: pnpm test:coverage:go
      - name: Upload Go coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage/go.coverprofile
          if-no-files-found: ignore

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @yujian/web playwright:install
      - name: Run E2E
        run: pnpm --filter @yujian/web test:e2e
      - name: Run admin E2E
        run: pnpm --filter @yujian/admin test:e2e
      - name: Build embedded browser and renderer assets
        run: pnpm build:server:assets
      - name: Run browser checks against standalone Go output
        run: pnpm test:embedded
      - name: Upload admin Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-playwright-report
          path: apps/admin/playwright-report
          if-no-files-found: ignore
      - name: Upload admin Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-playwright-test-results
          path: apps/admin/test-results
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Build single-program image
        run: docker build --tag yujian-server:ci .
      - name: Verify development mode starts without network or Node
        shell: bash
        run: |
          # No production configuration is injected; this checks development startup only.
          fail_startup() {
            echo "::error::$1"
            docker inspect --format '{{json .State}}' yujian-server-offline || true
            docker logs yujian-server-offline || true
            exit 1
          }
          # Keep exited containers until cleanup so startup failures retain their logs.
          docker run --detach --network none --name yujian-server-offline --entrypoint /usr/local/bin/yujian-server yujian-server:ci || fail_startup "Could not start offline container"
          for attempt in {1..20}; do
            state=$(docker inspect --format '{{.State.Status}}' yujian-server-offline) || fail_startup "Could not inspect offline container"
            case "$state" in
              running)
                if docker logs yujian-server-offline 2>&1 | grep -q '"msg":"http server listening"'; then
                  exit 0
                fi
                ;;
              created) ;;
              *) fail_startup "Offline container stopped during startup (state: $state)" ;;
            esac
            sleep 1
          done
          fail_startup "Offline container did not start within 20 seconds"
      - name: Run API and embedded admin smoke test
        shell: bash
        run: |
          docker run --detach --rm --name yujian-server-ci --publish 127.0.0.1:8080:8080 yujian-server:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              curl --fail --silent http://127.0.0.1:8080/ | grep -q '<!DOCTYPE html>'
              curl --fail --silent http://127.0.0.1:8080/preview | grep -q '<!DOCTYPE html>'
              exit 0
            fi
            sleep 1
          done
          docker logs yujian-server-ci
          exit 1
      - name: Scan final image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yujian-server:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Stop API container
        if: always()
        run: docker rm --force yujian-server-ci yujian-server-offline || true

  publisher-integration:
    name: Go Publisher PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YUJIAN_TEST_POSTGRES_URL: postgresql://publisher_test:publisher_test@127.0.0.1:15432/publisher_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: publisher_test
          POSTGRES_PASSWORD: publisher_test
          POSTGRES_DB: publisher_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U publisher_test -d publisher_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build embedded browser and renderer assets
        run: pnpm build:server:assets
      - name: Verify Go publisher and PostgreSQL integration
        working-directory: apps/server
        run: go test -race ./internal/publisher ./internal/store/postgres -count=1

  binaries:
    name: Build Linux ${{ matrix.goarch }} single executable
    needs: [frontend, go]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      BUILD_LABEL: ${{ inputs.version || github.sha }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Download validated embedded assets
        uses: actions/download-artifact@v8
        with:
          name: embedded-assets
          path: dist
      - name: Restore embedded assets
        run: tar -xzf dist/embedded-assets.tar.gz -C apps/server/internal/webassets/bundle
      - name: Compile standalone Go program
        working-directory: apps/server
        run: go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/yujian-server" ./cmd/api
      - name: Smoke test Linux amd64 executable
        if: matrix.goarch == 'amd64'
        shell: bash
        run: |
          expected_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' apps/server/cmd/api/version.go)
          test -n "$expected_version"
          test "$(./dist/yujian-server --version)" = "yujian-server $expected_version"
          # Development startup only: no production database, identity or cloud secrets.
          APP_ENV=development HTTP_ADDRESS=127.0.0.1:18080 ./dist/yujian-server > dist/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then cat dist/server.log; exit 1; fi
            if curl --fail --silent --connect-timeout 2 --max-time 3 http://127.0.0.1:18080/healthz; then
              curl --fail --silent --max-time 5 http://127.0.0.1:18080/ | grep -q '<!DOCTYPE html>'
              curl --fail --silent --max-time 5 http://127.0.0.1:18080/preview | grep -q '<!DOCTYPE html>'
              exit 0
            fi
            sleep 1
          done
          cat dist/server.log
          exit 1
      - name: Package executable and source identity
        shell: bash
        run: |
          if [[ ! "$BUILD_LABEL" =~ ^([0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$ ]]; then
            echo 'Invalid archive version or commit SHA.' >&2
            exit 1
          fi
          app_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' apps/server/cmd/api/version.go)
          test -n "$app_version"
          printf 'version=%s\ncommit=%s\nplatform=linux/%s\n' "$app_version" "$(git rev-parse HEAD)" "$GOARCH" > dist/BUILD-INFO.txt
          tar -czf "dist/yujian-server-$BUILD_LABEL-linux-$GOARCH.tar.gz" -C dist yujian-server BUILD-INFO.txt
      - name: Upload standalone program
        uses: actions/upload-artifact@v7
        with:
          name: yujian-server-linux-${{ matrix.goarch }}
          path: dist/yujian-server-*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload startup failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: binary-startup-log-${{ matrix.goarch }}
          path: dist/server.log
          if-no-files-found: ignore
