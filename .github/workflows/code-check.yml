name: Check Code

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: code-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend and static output
        run: pnpm verify
      - name: Verify generated TypeScript contract
        run: git diff --exit-code -- packages/schema/src/generated.ts
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

  go:
    name: Go Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Verify Go service
        run: pnpm verify:go
      - name: Verify synchronized Go contracts
        run: git diff --exit-code -- apps/server/internal/contract/schema.json apps/server/internal/httpapi/openapi.yaml
      - name: Run Go race tests
        working-directory: apps/server
        run: go test -race ./... -count=1

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript coverage
        run: pnpm test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore

  go-coverage:
    name: Go Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Verify Go coverage
        run: pnpm test:coverage:go
      - name: Upload Go coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage/go.coverprofile
          if-no-files-found: ignore

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @yujian/web playwright:install
      - name: Run E2E
        run: pnpm --filter @yujian/web test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --tag yujian-server:ci .
      - name: Run API smoke test
        shell: bash
        run: |
          docker run --detach --rm --name yujian-server-ci --publish 127.0.0.1:8080:8080 yujian-server:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs yujian-server-ci
          exit 1
      - name: Scan final image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yujian-server:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Stop API container
        if: always()
        run: docker rm --force yujian-server-ci || true
