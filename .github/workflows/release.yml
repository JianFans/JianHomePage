name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag and source version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout release event commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Resolve tag and verify synchronized versions
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release must run on a stable version tag (vX.Y.Z); select the tag as the workflow ref.' >&2
            exit 1
          fi
          tag=${GITHUB_REF#refs/tags/}
          sha=$(git rev-parse "$GITHUB_REF^{commit}")
          if [ "$sha" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Release tag does not match the workflow event commit.' >&2
            exit 1
          fi
          version=${tag#v}
          node scripts/set-release-version.mjs --check "$version"
          printf 'version=%s\ntag=%s\nsha=%s\nimage=ghcr.io/%s\n' "$version" "$tag" "$sha" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  checks:
    name: Validate and build release source
    needs: prepare
    uses: ./.github/workflows/code-check.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  image:
    name: Publish release image
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  publish:
    name: Publish GitHub Release and checksums
    needs: [prepare, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's standalone programs
        uses: actions/download-artifact@v8
        with:
          pattern: yujian-server-linux-*
          merge-multiple: true
          path: release-assets
      - name: Check source tag and publish assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}
        shell: bash
        run: |
          files=()
          for arch in amd64 arm64; do
            file="yujian-server-$RELEASE_VERSION-linux-$arch"
            test -s "$file"
            files+=("$file")
          done
          sha256sum --binary "${files[@]}" > SHA256SUMS.txt
          existing_sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq '.sha')
          if [ "$existing_sha" != "$RELEASE_SHA" ]; then
            echo 'Release tag does not point to the validated commit.' >&2
            exit 1
          fi
          if release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            case "$release_is_draft" in true|false) ;; *) echo 'Invalid release state.' >&2; exit 1 ;; esac
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes --notes "Single Go program; no Node.js runtime required. Docker (linux/amd64): $RELEASE_IMAGE:$RELEASE_TAG."
            release_is_draft=true
          fi
          existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          existing_directory=$(mktemp -d)
          trap 'rm -rf "$existing_directory"' EXIT
          for path in "${files[@]}" SHA256SUMS.txt; do
            asset=${path#./}
            if printf '%s\n' "$existing_assets" | grep -Fxq "$asset"; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$existing_directory"
              if ! cmp --silent "$path" "$existing_directory/$asset"; then
                echo "Existing release asset differs: $asset; refusing to overwrite it." >&2
                exit 1
              fi
            else
              if [ "$release_is_draft" != true ]; then
                echo 'Published release is incomplete; refusing to modify it.' >&2
                exit 1
              fi
              gh release upload "$RELEASE_TAG" "$path"
            fi
          done
          if [ "$release_is_draft" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            echo 'Release already published; all expected files match.'
          fi
