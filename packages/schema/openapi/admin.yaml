{
  "openapi": "3.1.0",
  "info": {
    "title": "遇健我管理 API",
    "version": "1.0.0",
    "description": "内容草稿、素材、审核、发布与回滚接口。管理操作接受 Bearer JWT 或 HttpOnly 会话 Cookie；Cookie 写操作必须携带精确允许的 Origin 和 X-CSRF-Token。"
  },
  "servers": [
    { "url": "https://api.yujian.me" }
  ],
  "paths": {
    "/api/v1/auth/session": {
      "get": {
        "operationId": "getSession",
        "responses": {
          "200": {
            "description": "当前浏览器会话，不缓存",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AdminSession"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/api/v1/auth/login": {
      "get": {
        "operationId": "startLogin",
        "description": "生成短期加密 state/nonce/PKCE Cookie，并跳转至 OIDC 托管登录页。",
        "responses": {
          "302": {
            "description": "跳转至配置的身份提供商"
          },
          "503": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/api/v1/auth/callback": {
      "get": {
        "operationId": "completeLogin",
        "parameters": [
          {
            "name": "code",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "校验 ID token 并设置不透明会话 Cookie，跳转至固定管理端 URL"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "撤销服务端会话并清除 Cookie"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "503": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/api/v1/versions/{versionId}/clone": {
      "post": {
        "operationId": "cloneVersion",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "description": "editor 或 admin 在事务内复制服务端源版本为独立 draft，revision 为 1，无审批状态。",
        "parameters": [
          {
            "$ref": "#/components/parameters/VersionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CloneVersionRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/VersionResponse"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "404": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/healthz": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "服务可用",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/Health" } }
            }
          }
        }
      }
    },
    "/api/v1/versions": {
      "post": {
        "operationId": "createVersion",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VersionCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/VersionResponse"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      },
      "get": {
        "operationId": "listVersions",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "description": "所有管理角色可读。按 createdAt 和 ID 倒序稳定分页，仅返回版本摘要。",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "版本摘要列表",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VersionList"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/api/v1/versions/{versionId}": {
      "get": {
        "operationId": "getVersion",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/VersionId" }],
        "responses": {
          "200": { "$ref": "#/components/responses/VersionResponse" },
          "404": { "$ref": "#/components/responses/ErrorResponse" }
        }
      },
      "put": {
        "operationId": "updateVersion",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [
          { "$ref": "#/components/parameters/VersionId" },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": { "type": "string", "pattern": "^\\\"[1-9][0-9]*\\\"$" }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": { "schema": { "$ref": "#/components/schemas/VersionWrite" } }
          }
        },
        "responses": {
          "200": { "$ref": "#/components/responses/VersionResponse" },
          "409": { "$ref": "#/components/responses/ErrorResponse" },
          "428": { "$ref": "#/components/responses/ErrorResponse" }
        }
      }
    },
    "/api/v1/versions/{versionId}/review": {
      "post": {
        "operationId": "submitReview",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/VersionId" }],
        "requestBody": { "$ref": "#/components/requestBodies/RevisionRequest" },
        "responses": { "200": { "$ref": "#/components/responses/VersionResponse" } }
      }
    },
    "/api/v1/versions/{versionId}/approve": {
      "post": {
        "operationId": "approveReview",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/VersionId" }],
        "requestBody": { "$ref": "#/components/requestBodies/RevisionRequest" },
        "responses": { "200": { "$ref": "#/components/responses/VersionResponse" } }
      }
    },
    "/api/v1/versions/{versionId}/reject": {
      "post": {
        "operationId": "rejectReview",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/VersionId" }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": { "schema": { "$ref": "#/components/schemas/RejectRequest" } }
          }
        },
        "responses": { "200": { "$ref": "#/components/responses/VersionResponse" } }
      }
    },
    "/api/v1/assets": {
      "get": {
        "operationId": "listAssets",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": { "enum": ["pending", "ready", "deleted"] }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": { "type": "string", "minLength": 1 }
          }
        ],
        "responses": {
          "200": {
            "description": "素材分页",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/AssetPage" } }
            }
          }
        }
      }
    },
    "/api/v1/assets/uploads": {
      "post": {
        "operationId": "createAssetUpload",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": { "schema": { "$ref": "#/components/schemas/AssetUploadRequest" } }
          }
        },
        "responses": {
          "201": {
            "description": "签名上传已创建",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/AssetUpload" } }
            }
          }
        }
      }
    },
    "/api/v1/assets/{assetId}/complete": {
      "post": {
        "operationId": "completeAssetUpload",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/AssetId" }],
        "responses": {
          "200": {
            "description": "素材已完成",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/Asset" } }
            }
          }
        }
      }
    },
    "/api/v1/assets/{assetId}": {
      "delete": {
        "operationId": "deleteAsset",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/AssetId" }],
        "responses": { "204": { "description": "素材已删除" } }
      }
    },
    "/api/v1/publishes": {
      "post": {
        "operationId": "createPublish",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{
          "name": "Idempotency-Key",
          "in": "header",
          "required": true,
          "schema": { "type": "string", "minLength": 8, "maxLength": 128 }
        }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": { "schema": { "$ref": "#/components/schemas/PublishRequest" } }
          }
        },
        "responses": {
          "202": {
            "description": "发布任务已创建",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/PublishJob" } }
            }
          }
        }
      }
    },
    "/api/v1/publishes/{publishId}": {
      "get": {
        "operationId": "getPublish",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/PublishId" }],
        "responses": {
          "200": {
            "description": "发布任务",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/PublishJob" } }
            }
          }
        }
      }
    },
    "/api/v1/publishes/{publishId}/refresh": {
      "post": {
        "operationId": "refreshPublish",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{ "$ref": "#/components/parameters/PublishId" }],
        "responses": {
          "200": {
            "description": "发布状态已刷新",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/PublishJob" } }
            }
          }
        }
      }
    },
    "/api/v1/rollbacks": {
      "post": {
        "operationId": "createRollback",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "parameters": [{
          "name": "Idempotency-Key",
          "in": "header",
          "required": true,
          "schema": { "type": "string", "minLength": 8, "maxLength": 128 }
        }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": { "schema": { "$ref": "#/components/schemas/RollbackRequest" } }
          }
        },
        "responses": {
          "202": {
            "description": "回滚任务已创建",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/PublishJob" } }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "yujian_session",
        "description": "不透明 HttpOnly、SameSite=Lax、生产 Secure Cookie；写操作另需 Origin 和 X-CSRF-Token。"
      }
    },
    "parameters": {
      "VersionId": { "name": "versionId", "in": "path", "required": true, "schema": { "type": "string" } },
      "AssetId": { "name": "assetId", "in": "path", "required": true, "schema": { "type": "string" } },
      "PublishId": { "name": "publishId", "in": "path", "required": true, "schema": { "type": "string" } }
    },
    "requestBodies": {
      "RevisionRequest": {
        "required": true,
        "content": {
          "application/json": { "schema": { "$ref": "#/components/schemas/RevisionRequest" } }
        }
      }
    },
    "responses": {
      "VersionResponse": {
        "description": "内容版本",
        "headers": { "ETag": { "schema": { "type": "string" } } },
        "content": {
          "application/json": { "schema": { "$ref": "#/components/schemas/ContentVersion" } }
        }
      },
      "ErrorResponse": {
        "description": "错误",
        "content": {
          "application/json": { "schema": { "$ref": "#/components/schemas/Error" } }
        }
      }
    },
    "schemas": {
      "AdminPrincipal": {
        "type": "object",
        "required": [
          "subject",
          "roles"
        ],
        "properties": {
          "subject": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "editor",
                "reviewer",
                "publisher",
                "admin"
              ]
            }
          }
        }
      },
      "AdminSession": {
        "type": "object",
        "required": [
          "authenticated",
          "loginAvailable"
        ],
        "properties": {
          "authenticated": {
            "type": "boolean"
          },
          "loginAvailable": {
            "type": "boolean"
          },
          "principal": {
            "$ref": "#/components/schemas/AdminPrincipal"
          },
          "csrfToken": {
            "type": "string",
            "description": "仅已认证时返回，Cookie 写操作必须作为 X-CSRF-Token 发送。"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "authenticated": {
                  "const": true
                }
              }
            },
            "then": {
              "required": [
                "principal",
                "csrfToken",
                "expiresAt"
              ]
            }
          }
        ]
      },
      "VersionSummary": {
        "type": "object",
        "required": [
          "id",
          "name",
          "status",
          "revision",
          "checksum",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" },
          "id": {
            "type": "string"
          },
          "status": {
            "enum": [
              "draft",
              "in_review",
              "publishing",
              "published",
              "archived"
            ]
          },
          "revision": {
            "type": "integer"
          },
          "checksum": {
            "type": "string"
          },
          "reviewApproved": {
            "type": "boolean"
          },
          "name": {
            "type": "string",
            "maxLength": 120,
            "description": "可选显示名称；省略或为空时回退版本 ID。"
          },
          "sourceVersionId": {
            "type": "string"
          }
        },
        "description": "只含元数据，不包含 snapshot。"
      },
      "VersionList": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VersionSummary"
            }
          },
          "nextCursor": {
            "type": "string"
          }
        }
      },
      "CloneVersionRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "description": "可选显示名称；省略或为空时回退版本 ID。"
          }
        }
      },
      "Health": {
        "type": "object",
        "required": ["status"],
        "properties": { "status": { "const": "ok" } }
      },
      "VersionWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": ["snapshot"],
        "properties": {
          "snapshot": { "type": "object", "additionalProperties": true }
        }
      },
      "VersionCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "snapshot"
        ],
        "properties": {
          "snapshot": {
            "type": "object",
            "additionalProperties": true
          },
          "name": {
            "type": "string",
            "maxLength": 120,
            "description": "可选显示名称；省略或为空时回退版本 ID。"
          }
        }
      },
      "RevisionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["revision"],
        "properties": { "revision": { "type": "integer", "minimum": 1 } }
      },
      "RejectRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["revision", "reason"],
        "properties": {
          "revision": { "type": "integer", "minimum": 1 },
          "reason": { "type": "string", "minLength": 1, "maxLength": 1000 }
        }
      },
      "ContentVersion": {
        "type": "object",
        "required": [
          "id",
          "status",
          "revision",
          "snapshot",
          "checksum"
        ],
        "properties": {
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" },
          "id": {
            "type": "string"
          },
          "status": {
            "enum": [
              "draft",
              "in_review",
              "publishing",
              "published",
              "archived"
            ]
          },
          "revision": {
            "type": "integer"
          },
          "snapshot": {
            "type": "object",
            "additionalProperties": true
          },
          "checksum": {
            "type": "string"
          },
          "reviewApproved": {
            "type": "boolean"
          },
          "name": {
            "type": "string",
            "maxLength": 120,
            "description": "可选显示名称；省略或为空时回退版本 ID。"
          },
          "sourceVersionId": {
            "type": "string"
          }
        }
      },
      "LocalizedText": {
        "type": "object",
        "additionalProperties": false,
        "required": ["zh-CN"],
        "properties": {
          "zh-CN": { "type": "string", "minLength": 1 },
          "en": { "type": "string", "minLength": 1 }
        }
      },
      "AssetRights": {
        "type": "object",
        "additionalProperties": false,
        "required": ["source"],
        "properties": {
          "source": { "$ref": "#/components/schemas/LocalizedText" },
          "credit": { "type": "string" },
          "license": { "type": "string" }
        }
      },
      "AssetUploadRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["fileName", "contentType", "size", "checksum", "rights"],
        "properties": {
          "fileName": { "type": "string" },
          "contentType": {
            "enum": ["image/webp", "image/gif", "video/mp4", "audio/wav", "audio/mpeg"]
          },
          "size": { "type": "integer", "minimum": 1 },
          "checksum": { "type": "string", "pattern": "^sha256:[0-9a-fA-F]{64}$" },
          "rights": { "$ref": "#/components/schemas/AssetRights" }
        }
      },
      "Asset": {
        "type": "object",
        "required": ["id", "src", "status", "metadata", "rights"],
        "properties": {
          "id": { "type": "string" },
          "src": {
            "description": "可直接写入内容快照的稳定公开地址；生产环境使用 HTTPS，/media/* 仅用于本地开发。",
            "oneOf": [
              { "type": "string", "format": "uri", "pattern": "^https://" },
              { "type": "string", "pattern": "^/media/" }
            ]
          },
          "status": { "enum": ["pending", "ready", "deleted"] },
          "metadata": { "type": "object", "additionalProperties": true },
          "rights": { "$ref": "#/components/schemas/AssetRights" },
          "createdAt": { "type": "string", "format": "date-time" },
          "deletedAt": { "type": "string", "format": "date-time" }
        }
      },
      "AssetPage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/Asset" } },
          "nextCursor": { "type": "string", "minLength": 1 }
        }
      },
      "AssetUpload": {
        "type": "object",
        "required": ["asset", "uploadUrl", "expiresAt"],
        "properties": {
          "asset": { "$ref": "#/components/schemas/Asset" },
          "uploadUrl": { "type": "string", "format": "uri" },
          "headers": { "type": "object", "additionalProperties": { "type": "string" } },
          "expiresAt": { "type": "string", "format": "date-time" }
        }
      },
      "PublishRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["versionId"],
        "properties": { "versionId": { "type": "string" } }
      },
      "RollbackRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["versionId"],
        "properties": { "versionId": { "type": "string" } }
      },
      "PublishJob": {
        "type": "object",
        "required": ["id", "versionId", "status", "snapshotKey", "snapshotChecksum"],
        "properties": {
          "id": { "type": "string" },
          "versionId": { "type": "string" },
          "status": { "enum": ["pending", "building", "succeeded", "failed"] },
          "snapshotKey": { "type": "string" },
          "snapshotChecksum": { "type": "string" },
          "buildId": { "type": "string" },
          "errorMessage": { "type": "string" }
        }
      },
      "Error": {
        "type": "object",
        "required": ["code", "message", "requestId"],
        "properties": {
          "code": { "type": "string" },
          "message": { "type": "string" },
          "requestId": { "type": "string" }
        }
      }
    }
  }
}
